[package]
name = "cornercase"
version = "0.12.25"
edition = "2024"
description = "A terminal multiplexer for projects, git worktrees and coding agents, driven by the mouse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/usecornercase/cornercase-terminal"
homepage = "https://github.com/usecornercase/cornercase-terminal"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "worktree"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arborium = { version = "2.18.2", default-features = false, features = [
  "lang-asciidoc", "lang-asm", "lang-bash", "lang-batch", "lang-c", "lang-capnp", "lang-clojure", "lang-cmake",
  "lang-css", "lang-devicetree", "lang-diff", "lang-dockerfile", "lang-dot", "lang-elisp", "lang-elm", "lang-fish",
  "lang-gitattributes", "lang-go", "lang-graphql", "lang-hcl", "lang-html", "lang-ini", "lang-java",
  "lang-javascript", "lang-jinja2", "lang-jq", "lang-jsdoc", "lang-json", "lang-just", "lang-kconfig", "lang-kdl",
  "lang-lua", "lang-make", "lang-markdown", "lang-meson", "lang-ninja", "lang-nix", "lang-prolog", "lang-proto",
  "lang-python", "lang-regex", "lang-rego", "lang-ron", "lang-rust", "lang-scheme", "lang-scss", "lang-sparql",
  "lang-ssh-config", "lang-starlark", "lang-svelte", "lang-textproto", "lang-thrift", "lang-toml", "lang-tsx",
  "lang-typescript", "lang-vue", "lang-wit", "lang-xml", "lang-yaml", "lang-zsh"
] }
arborium-highlight = "2.18.2"
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29.0", features = ["serde"] }
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
icy_sixel = "0.7.0"
ignore = "0.4.25"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
libghostty-vt = { version = "=0.2.2", default-features = false }
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process", "stdio", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
thiserror = "2.0.21"
ureq = "3.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
insta = "1.48.0"
rstest = "0.27.0"
rustix = { version = "1.1.5", features = ["mm"] }
vt100 = "0.16.2"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.icy_sixel]
opt-level = 3

[profile.dev.package.quantette]
opt-level = 3

[profile.dev.package.palette]
opt-level = 3
