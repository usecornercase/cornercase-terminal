[package]
name = "cornercase"
version = "0.12.265"
edition = "2024"
description = "A terminal multiplexer for projects, git worktrees and coding agents, driven by the mouse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/usecornercase/cornercase-terminal"
homepage = "https://github.com/usecornercase/cornercase-terminal"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "worktree"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arborium = { version = "2.18.2", default-features = false, features = [
  "lang-asciidoc", "lang-asm", "lang-bash", "lang-batch", "lang-c", "lang-capnp", "lang-clojure", "lang-cmake",
  "lang-css", "lang-devicetree", "lang-diff", "lang-dockerfile", "lang-dot", "lang-elisp", "lang-elm", "lang-fish",
  "lang-gitattributes", "lang-go", "lang-graphql", "lang-hcl", "lang-html", "lang-ini", "lang-java",
  "lang-javascript", "lang-jinja2", "lang-jq", "lang-jsdoc", "lang-json", "lang-just", "lang-kconfig", "lang-kdl",
  "lang-lua", "lang-make", "lang-markdown", "lang-meson", "lang-ninja", "lang-nix", "lang-prolog", "lang-proto",
  "lang-python", "lang-regex", "lang-rego", "lang-ron", "lang-rust", "lang-scheme", "lang-scss", "lang-sparql",
  "lang-ssh-config", "lang-starlark", "lang-svelte", "lang-textproto", "lang-thrift", "lang-toml", "lang-tsx",
  "lang-typescript", "lang-vue", "lang-wit", "lang-xml", "lang-yaml", "lang-zsh"
] }
arborium-highlight = "2.18.2"
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29.0", features = ["serde"] }
flate2 = "1.1.10"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
httparse = "1.10.1"
icy_sixel = "0.7.0"
ignore = "0.4.25"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
libghostty-vt = { version = "=0.2.2", default-features = false }
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.3", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "3.4.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "net", "param", "process", "stdio", "termios"] }
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Foundation", "Win32_Media_Audio",
  "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO",
  "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Memory",
  "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
insta = "1.48.0"
rstest = "0.27.0"
vt100 = "0.16.2"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["mm"] }

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.icy_sixel]
opt-level = 3

[profile.dev.package.quantette]
opt-level = 3

[profile.dev.package.palette]
opt-level = 3
