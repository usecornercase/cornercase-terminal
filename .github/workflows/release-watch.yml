name: Release watch

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: release-watch
  cancel-in-progress: false

permissions: {}

jobs:
  watch:
    name: re-run, tell and complete the newest releases
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/version.sh watch
