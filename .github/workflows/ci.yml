name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            timeout: 30
            threads: 8
          - os: macos-15
            timeout: 45
            threads: 8
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo nextest run --locked --profile ci --test-threads ${{ matrix.threads }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          overwrite: true

  windows:
    name: clippy + tests (windows-2025)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: long paths
        run: git config --system core.longpaths true

      - name: console host
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP\conpty.zip"
          $unpacked = "$env:RUNNER_TEMP\conpty-package"
          $host_dir = "$env:RUNNER_TEMP\conpty"
          Invoke-WebRequest -Uri https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/1.25.260930003/microsoft.windows.console.conpty.1.25.260930003.nupkg -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne '02b07b349af66d801159bdf9e440d4a1ce78bb951f37fc8609731665afdae7ee') { throw 'unexpected ConPTY package' }
          Expand-Archive $package $unpacked
          New-Item -ItemType Directory -Force $host_dir | Out-Null
          Copy-Item "$unpacked\runtimes\win-x64\native\conpty.dll" $host_dir
          Copy-Item "$unpacked\build\native\runtimes\x64\OpenConsole.exe" $host_dir
          Add-Content $env:GITHUB_PATH $host_dir

      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  guardrails:
    name: fmt + machete + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: version
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: .github/version.sh check "origin/${{ github.base_ref }}"

      - name: version.sh tests
        if: ${{ !cancelled() }}
        run: .github/version.test.sh

      - name: toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: fmt
        run: cargo fmt --check

      - name: AGENTS.md within Codex's 32 KiB
        if: ${{ !cancelled() }}
        run: test "$(wc -c < AGENTS.md)" -le 32768

      - name: machete
        if: ${{ !cancelled() }}
        run: cargo-machete

      - name: jscpd
        if: ${{ !cancelled() }}
        run: npx -y jscpd@4.3.0
