name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  windows:
    name: check (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: check
        id: check
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets --all-features --locked --message-format=short 2>&1 | tee check.log

      - name: summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo '### Windows'
            if [ "$OUTCOME" = success ]; then
              echo '`cornercase` compiles'
            else
              grep -oE 'could not compile `cornercase` \([^)]*\) due to [0-9]+ previous errors?' check.log ||
                echo '`cargo check` failed before reaching `cornercase`: see its log'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  guardrails:
    name: fmt + machete + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: version
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: .github/version.sh check "origin/${{ github.base_ref }}"

      - name: toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: fmt
        run: cargo fmt --check

      - name: AGENTS.md within Codex's 32 KiB
        if: ${{ !cancelled() }}
        run: test "$(wc -c < AGENTS.md)" -le 32768

      - name: machete
        if: ${{ !cancelled() }}
        run: cargo-machete

      - name: jscpd
        if: ${{ !cancelled() }}
        run: npx -y jscpd@4.3.0
