name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: tag and release a new version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/version.sh release
