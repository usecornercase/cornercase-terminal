- name: zig
  uses: mlugg/setup-zig@v2
  with:
    version: 0.15.2
    use-cache: false
- name: ghostty
  shell: bash
  env:
    TARGET: ${{ matrix.targets[0] }}
  run: |
    case "$TARGET" in *-windows-msvc) export RUSTFLAGS=-Ctarget-feature=+crt-static ;; esac
    for attempt in 1 2 3; do
      cargo build --locked --profile dist --target "$TARGET" -p libghostty-vt-sys && exit 0
      echo "::warning::building Ghostty failed (attempt $attempt of 3)"
      if [ "$attempt" -lt 3 ]; then sleep 60; fi
    done
    exit 1
