# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - dependabot[bot]

  path_filters:
    - "!target/**"
    - "!Cargo.lock"
    - "!site/package-lock.json"
    - "!skills-lock.json"
    - "!src/snapshots/**"
    - "!site/src/screens/**"
    - "!.github/workflows/release.yml"
    - "!.agents/**"

  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Follow AGENTS.md and DESIGN.md. Never suggest adding comments or doc comments: the project has none on purpose.
        Flag `unwrap()` outside tests, `std::sync::Mutex` instead of `parking_lot::Mutex`, and new keyboard shortcuts.
        If the PR changes the app (src/, Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/), check that it bumps
        `version` in Cargo.toml and adds a matching `## <version>` section to CHANGELOG.md written for users.
        If it adds, removes or changes a feature, setting, message or click, check that site/ is updated too.
    - path: "tests/**/*.rs"
      instructions: |
        Tests must not sleep; they wait with `test_util::wait_until` or for output that proves the previous step finished.
        They must never call real `gh`, Shortcut or Linear, nor use the user's shell or config.
    - path: "site/**"
      instructions: |
        The site must match the app. Internal doc links are relative with a trailing slash.
        The landing simulation in site/src/lib/demo/ mirrors src/ui.rs.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    clippy:
      enabled: false
    github-checks:
      enabled: true

chat:
  art: false
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - DESIGN.md
